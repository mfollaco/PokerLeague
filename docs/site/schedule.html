<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Poker League – Schedule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Custom Theme -->
  <link rel="stylesheet" href="assets/css/vegas.css" />
</head>

<body class="bg-vegas text-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-vegas-dark border-bottom border-gold">
    <div class="container">
      <a class="navbar-brand neon-gold" href="index.html">♠ PokerLeague ♣</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
          <li class="nav-item"><a class="nav-link" href="analytics.html">Analytics</a></li>
          <li class="nav-item"><a class="nav-link" href="timer.html">Timer</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="py-5">
    <div class="container">
      <h1 class="neon-subtitle mb-4">Season 2026 Schedule</h1>

      <div class="table-responsive card card-vegas p-3">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead class="table-gold">
            <tr>
              <th>Event</th>
              <th>Date</th>
              <th>Buy-In</th>
              <th>Location</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="schedule-body">
            <tr>
              <td colspan="5" class="text-center text-muted">Loading schedule…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="py-4 border-top border-gold mt-auto bg-vegas-dark">
    <div class="container text-center small text-muted-vegas">
      ♠ ♥ ♦ ♣ PokerLeague Schedule • Season 2026 ♣ ♦ ♥ ♠
    </div>
  </footer>

  <!-- DATA LOADER -->
  <script>
    async function loadSchedule() {
      try {
        const res = await fetch('assets/data/season_2026.json');
        const data = await res.json();

        const tbody = document.getElementById('schedule-body');
        const events = data.schedule || [];

        if (!events.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No schedule data yet.</td></tr>';
          return;
        }

        tbody.innerHTML = events.map(ev => `
          <tr>
            <td class="text-gold">${ev.name}</td>
            <td>${new Date(ev.date).toLocaleString()}</td>
            <td>${ev.buy_in}</td>
            <td>${ev.location}</td>
            <td>
              ${ev.completed
                ? '<span class="badge bg-success">Completed</span>'
                : '<span class="badge bg-warning text-dark">Upcoming</span>'}
            </td>
          </tr>
        `).join('');

      } catch (err) {
        console.error(err);
      }
    }

    loadSchedule();
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
